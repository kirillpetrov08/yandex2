# --- Сборка ---
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Реклама Яндекс РСЯ ---
# ПЕРЕД РЕЛИЗОМ ОБЯЗАТЕЛЬНО:
#   ads.testMode=false
#   и реальные ID блоков вида R-M-XXXXXXX-Y (из кабинета РСЯ).
# Демо-блоки в релизе = показы без дохода.
ads.testMode=true
ads.bannerUnitId=demo-banner-yandex
ads.interstitialUnitId=demo-interstitial-yandex
ads.rewardedUnitId=demo-rewarded-yandex
ads.interstitialEveryNthConversion=3
ads.interstitialMinIntervalSeconds=120
ads.rewardedNoAdsMinutes=30
