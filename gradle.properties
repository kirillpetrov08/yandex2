# Если в кабинете создадите новые блоки — поменяйте ID здесь. Демо-строки вида demo-*-yandex
# оставлять в релизе нельзя: сборка с testMode=false упадёт на проверке в app/build.gradle.kts.
ads.testMode=false
ads.bannerUnitId=R-M-20230616-2
ads.interstitialUnitId=R-M-20230616-4
ads.rewardedUnitId=R-M-20230616-7
ads.interstitialEveryNthConversion=3
ads.interstitialMinIntervalSeconds=120
