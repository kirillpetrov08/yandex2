name: Создать ключ подписи (один раз)

# Нужен ТОЛЬКО если на вашем компьютере нет Java/keytool, а ключ подписи приложения
# создать надо. В обычном случае генерируйте ключ локально (docs/CI_BUILD.md, шаг A):
# там он не проходит через GitHub.
#
# Как пользоваться:
#   1. Убедитесь, что в секретах репозитория есть KEYSTORE_PASSWORD (пароль, который вы
#      придумали для хранилища). Этот воркфлоу берёт пароль только из секрета — в логах
#      он не появляется.
#   2. Actions → «Создать ключ подписи (один раз)» → Run workflow.
#   3. Скачайте артефакт signing-key, внутри app-signing.keystore и app-signing.keystore.b64.
#   4. Сохраните файл в ДВУХ местах (менеджер паролей, облако, флешка).
#   5. Сразу удалите артефакт и прогон: он содержит приватный ключ.
#
# ВАЖНО: делайте это в приватном репозитории. Артефакты видны всем, у кого есть доступ
# к репозиторию. Пароль ключа менять нельзя потом «на лету» — только пересоздавать ключ.

on:
  workflow_dispatch:
    inputs:
      dname:
        description: 'Данные сертификата (можно оставить как есть или вписать свои)'
        required: false
        default: 'CN=Converter Plus, OU=Mobile, O=Self-employed, L=Moscow, ST=Moscow, C=RU'

jobs:
  keystore:
    name: Генерация ключа
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Проверка секрета с паролем
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error title=Нет секрета KEYSTORE_PASSWORD::Добавьте секрет KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions) — это придуманный вами пароль хранилища — и запустите снова."
            exit 1
          fi
          echo "Секрет KEYSTORE_PASSWORD есть (значение не выводится)"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать ключ
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DNAME: ${{ inputs.dname }}
        run: |
          set -euo pipefail
          rm -f app-signing.keystore
          keytool -genkeypair -v \
            -keystore app-signing.keystore \
            -alias sign \
            -keyalg RSA -keysize 4096 -validity 10000 -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
            -dname "$DNAME"
          echo "--- Проверка ключа и отпечаток (сохраните его) ---"
          keytool -list -v -keystore app-signing.keystore -alias sign -storepass "$STORE_PASSWORD" \
            | grep -E "Alias name|Owner|Valid from|SHA256:"
          base64 -w0 app-signing.keystore > app-signing.keystore.b64
          ls -l app-signing.keystore app-signing.keystore.b64

      - name: Артефакт с ключом
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            app-signing.keystore
            app-signing.keystore.b64
          retention-days: 1

      - name: Напоминание
        if: always()
        run: |
          {
            echo "## Ключ создан"
            echo ""
            echo "1. Скачайте артефакт **signing-key**."
            echo "2. Внутри: \`app-signing.keystore\` (ключ) и \`app-signing.keystore.b64\` (то же в base64 — для секрета \`KEYSTORE_BASE64\`)."
            echo "3. Сохраните ключ в двух местах и запишите пароль в менеджер паролей."
            echo "4. **Удалите артефакт и этот прогон**: в нём лежит приватный ключ."
            echo "5. Содержимое \`app-signing.keystore.b64\` вставьте в секрет \`KEYSTORE_BASE64\`."
          } >> "$GITHUB_STEP_SUMMARY"
