name: Создать ключ подписи (один раз)

# Нужен ТОЛЬКО если на вашем компьютере нет Java/keytool, а ключ подписи приложения
# создать надо. В обычном случае генерируйте ключ локально (docs/CI_BUILD.md, шаг A):
# там он не проходит через GitHub.
#
# Как пользоваться:
#   1. Убедитесь, что в секретах репозитория есть KEYSTORE_PASSWORD (пароль, который вы
#      придумали для хранилища). Этот воркфлоу берёт пароль только из секрета — в логах
#      он не появляется.
#   2. Actions → «Создать ключ подписи (один раз)» → Run workflow.
#   3. Скачайте артефакт signing-key, внутри app-signing.keystore и app-signing.keystore.b64.
#   4. Сохраните файл в ДВУХ местах (менеджер паролей, облако, флешка).
#   5. Сразу удалите артефакт и прогон: он содержит приватный ключ.
#
# ВАЖНО: в ПУБЛИЧНОМ репозитории артефакт с ключом может скачать любой пользователь GitHub.
# Поэтому воркфлоу сам проверяет видимость репозитория: в публичном он не запустится, пока вы
# не подтвердите риск в поле подтверждения. Безопасные варианты:
#   • перевести репозиторий в приватный, сгенерировать ключ, вернуть публичность;
#   • или создать ключ локально (docs/CI_BUILD.md, шаг A1) — тогда ключ вообще не покидает компьютер.
# Пароль ключа потом менять «на лету» нельзя — только пересоздавать ключ.

on:
  workflow_dispatch:
    inputs:
      confirm_public:
        description: 'Публичный репозиторий? Впишите РАЗРЕШАЮ, чтобы всё равно создать ключ здесь'
        required: false
        default: ''
      dname:
        description: 'Данные сертификата (можно оставить как есть или вписать свои)'
        required: false
        default: 'CN=Converter Plus, OU=Mobile, O=Self-employed, L=Moscow, ST=Moscow, C=RU'

jobs:
  keystore:
    name: Генерация ключа
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Проверка видимости репозитория
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_PUBLIC: ${{ inputs.confirm_public }}
        run: |
          set -euo pipefail
          PRIVATE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r '.private')
          echo "Репозиторий приватный: $PRIVATE"
          if [ "$PRIVATE" = "true" ]; then
            echo "Ок: артефакт с ключом видят только владелец и соавторы репозитория"
            exit 0
          fi
          if [ "$CONFIRM_PUBLIC" = "РАЗРЕШАЮ" ]; then
            echo "::warning title=Публичный репозиторий::Ключ попадёт в артефакт публичного репозитория — сразу после скачивания удалите прогон (⋯ → Delete run), он удалит и артефакт."
            exit 0
          fi
          echo "::error title=Публичный репозиторий::Артефакт с ключом сможет скачать любой пользователь GitHub. Переведите репозиторий в приватный (Settings → General → Danger zone → Change visibility → Make private) или создайте ключ локально (docs/CI_BUILD.md, шаг A1). Если согласны на риск — запустите снова и впишите в поле подтверждения РАЗРЕШАЮ."
          exit 1

      - name: Проверка секрета с паролем
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error title=Нет секрета KEYSTORE_PASSWORD::Добавьте секрет KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions) — это придуманный вами пароль хранилища — и запустите снова."
            exit 1
          fi
          echo "Секрет KEYSTORE_PASSWORD есть (значение не выводится)"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать ключ
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DNAME: ${{ inputs.dname }}
        run: |
          set -euo pipefail
          rm -f app-signing.keystore
          keytool -genkeypair -v \
            -keystore app-signing.keystore \
            -alias sign \
            -keyalg RSA -keysize 4096 -validity 10000 -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
            -dname "$DNAME"
          echo "--- Проверка ключа и отпечаток (сохраните его) ---"
          keytool -list -v -keystore app-signing.keystore -alias sign -storepass "$STORE_PASSWORD" \
            | grep -E "Alias name|Owner|Valid from|SHA256:"
          base64 -w0 app-signing.keystore > app-signing.keystore.b64
          ls -l app-signing.keystore app-signing.keystore.b64

      - name: Артефакт с ключом
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            app-signing.keystore
            app-signing.keystore.b64
          retention-days: 1

      - name: Напоминание
        if: always()
        run: |
          {
            echo "## Ключ создан"
            echo ""
            echo "1. Скачайте артефакт **signing-key**."
            echo "2. Внутри: \`app-signing.keystore\` (ключ) и \`app-signing.keystore.b64\` (то же в base64 — для секрета \`KEYSTORE_BASE64\`)."
            echo "3. Сохраните ключ в двух местах и запишите пароль в менеджер паролей."
            echo "4. **Удалите артефакт и этот прогон**: в нём лежит приватный ключ."
            echo "5. Содержимое \`app-signing.keystore.b64\` вставьте в секрет \`KEYSTORE_BASE64\`."
          } >> "$GITHUB_STEP_SUMMARY"
