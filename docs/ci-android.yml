name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Именно @v4: в @v3 дефолтный пакет 'tools' удалён из репозитория SDK и шаг падает
      - uses: android-actions/setup-android@v4

      - name: Установка платформы
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
            echo "KEYSTORE_FILE=upload-keystore.jks" >> "$GITHUB_ENV"
          else
            echo "::warning title=Нет ключа подписи::AAB будет без подписи"
          fi

      - name: Тесты
        run: ./gradlew testDebugUnitTest

      - name: Сборка (APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Проверка подписи (APK и AAB)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || true)
          AAB=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null || true)
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APK" ] && [ -n "$APKSIGNER" ] && "$APKSIGNER" verify "$APK" > /dev/null 2>&1; then
            echo "Подпись APK OK"
            "$APKSIGNER" verify --print-certs "$APK" | grep -E "SHA-256|Signer" || true
          else
            echo "::warning title=APK не подписан::Добавьте секреты KEYSTORE_* — такой APK в магазин не годится"
          fi
          if [ -n "$AAB" ] && jarsigner -verify -verbose -certs "$AAB" > /dev/null 2>&1; then
            echo "Подпись AAB OK"
          else
            echo "::warning title=AAB не подписан::Добавьте секреты KEYSTORE_*"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: app/build/outputs
